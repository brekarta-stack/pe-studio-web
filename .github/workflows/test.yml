name: test

on:
  push:
    branches: [main]
  pull_request:
  # 수동 실행 — Actions 가 실제로 도는지 확인할 때, 그리고 실패 재현용.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Vercel 프로젝트의 런타임(24.x)과 맞춘다
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
