# /etc/sysctl.d/99-agent-backbone.conf 로 배치된다 (install-cron.sh가 복사·적용).
#
# 왜 필요한가: 컨테이너 포트를 Tailscale IP(100.x)에만 바인딩하는데, 부팅 시
# tailscale 컨테이너보다 백본 컨테이너가 먼저 복원되면 그 IP가 아직 없어
# "cannot assign requested address"로 죽는다(2026-07-24 재부팅 드릴에서 실측).
# 이 설정은 아직 존재하지 않는 주소에도 바인딩을 허용해 그 창을 없앤다.
#
# ⚠️ UGOS 업데이트가 /etc/sysctl.d를 리셋할 수 있다 — 업데이트 후 존재를 확인할 것.
net.ipv4.ip_nonlocal_bind=1
net.ipv6.ip_nonlocal_bind=1
